<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Frequencies & Cymatics</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>Planetary Frequencies</h2>
        <div class="controls">
            <select id="planet-select">
                <option value="194.18">Earth (Day) - 194.18 Hz</option>
                <option value="210.42">Moon (Synodic) - 210.42 Hz</option>
                <option value="136.10">Sun - 136.10 Hz</option>
                <option value="141.27">Mercury - 141.27 Hz</option>
                <option value="221.23">Venus - 221.23 Hz</option>
                <option value="144.72">Mars - 144.72 Hz</option>
                <option value="183.58">Jupiter - 183.58 Hz</option>
                <option value="207.36">Saturn - 207.36 Hz</option>
                <option value="211.44">Uranus - 211.44 Hz</option>
                <option value="221.23">Neptune - 221.23 Hz</option>
                <option value="140.25">Pluto - 140.25 Hz</option>
            </select>
            <button id="play-btn">Play</button>
            <button id="stop-btn">Stop</button>
            <button id="mode-toggle">Circle Mode</button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
