<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planetary Frequencies & Cymatics</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Tone.js for Audio -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Three.js and Addons via Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Full-screen visualizer canvas -->
    <div id="canvas-container"></div>

    <!-- Main UI Panel -->
    <div id="ui-panel">
        <h2>Planetary Frequencies</h2>
        
        <!-- Planet Preset Grid -->
        <div id="planet-grid">
            <!-- Buttons will be generated by JavaScript -->
        </div>

        <!-- Main Controls -->
        <div class="controls">
            <button id="play-btn">Play</button>
            <button id="stop-btn">Stop</button>
            <button id="mode-toggle">Circle Mode</button>
            <button id="view-toggle">2D View</button>
            <label class="toggle-switch">
                <input type="checkbox" id="binaural-toggle">
                <span class="slider"></span>
                Binaural
            </label>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
            <span id="midi-status">MIDI: Off</span>
        </div>

        <!-- Info Display -->
        <div id="info-display">
            <p id="info-text">Select a planet to begin</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
